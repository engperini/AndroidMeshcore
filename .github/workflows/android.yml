name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v0.2.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so rev-list --count increases per commit

      - name: Set monotonically increasing APK version
        shell: bash
        run: echo "MESHCORE_VERSION_CODE=$((1000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      # A release tag (pushed, or given to a manual run) also names the version: v0.2.0 -> 0.2.0.
      - name: Release tag
        shell: bash
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
        run: |
          tag="$INPUT_RELEASE"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"; fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad release tag: $tag" >&2; exit 1; }
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            echo "MESHCORE_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners include an Android SDK. As in MeshSDR, skip
      # setup-android (it fails on current runners) and install packages directly.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:?Android SDK not available on runner}"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build host test node (same firmware sources as the app)
        run: tools/hosttest/build.sh

      - name: Tests and APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleRelease > build.log 2>&1
          code=$?
          grep -n -E '(error:|FAILED|FAILURE:|What went wrong|CMake Error|ninja: error|e: file)' build.log | tail -60 || true
          tail -60 build.log
          exit "$code"

      - name: Show APK version and signing certificate
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | head -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -E 'SHA-256|DN'
          cp "$apk" MeshCoreUSB.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-and-screenshots
          path: |
            build.log
            app/build/screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MeshCoreUSB-apk
          path: MeshCoreUSB.apk

      # Creates the tag on this commit when the run was started by hand with a release tag.
      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: MeshCore USB ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: MeshCoreUSB.apk
